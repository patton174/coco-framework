COCO_IDEMPOTENCY_SCOPE_REQUIRED=An authenticated caller or explicit business idempotency scope is required.
COCO_IDEMPOTENCY_KEY_REQUIRED=Idempotency-Key is required for this route.
COCO_IDEMPOTENCY_KEY_INVALID=Idempotency-Key is invalid.
COCO_IDEMPOTENCY_IN_PROGRESS=The request with this idempotency key is still in progress.
COCO_IDEMPOTENCY_REQUEST_TOO_LARGE=The request body exceeds the idempotency capture limit.
COCO_IDEMPOTENCY_PAYLOAD_MISMATCH=This idempotency key is already bound to a different request.
COCO_IDEMPOTENCY_RESPONSE_TOO_LARGE=The response body exceeds the idempotency replay limit.
COCO_IDEMPOTENCY_RESPONSE_HEADERS_TOO_LARGE=The response headers exceed the idempotency replay limit.
COCO_IDEMPOTENCY_UNSAFE_RESPONSE_HEADER=The response contains headers that cannot be cached or replayed safely.
COCO_IDEMPOTENCY_UNSUPPORTED_IO=The request uses an I/O lifecycle that idempotency cannot safely capture.
COCO_IDEMPOTENCY_CAPACITY_EXCEEDED=The idempotency store has reached its capacity.
COCO_IDEMPOTENCY_STORE_UNAVAILABLE=The idempotency store is unavailable.
