COCO_IDEMPOTENCY_SCOPE_REQUIRED=必须提供已认证调用方或显式业务幂等作用域。
COCO_IDEMPOTENCY_KEY_REQUIRED=该路由必须提供 Idempotency-Key。
COCO_IDEMPOTENCY_KEY_INVALID=Idempotency-Key 格式无效。
COCO_IDEMPOTENCY_IN_PROGRESS=该幂等键对应的请求仍在执行。
COCO_IDEMPOTENCY_REQUEST_TOO_LARGE=请求体超过幂等捕获上限。
COCO_IDEMPOTENCY_PAYLOAD_MISMATCH=该幂等键已绑定到不同请求。
COCO_IDEMPOTENCY_RESPONSE_TOO_LARGE=响应体超过幂等重放上限。
COCO_IDEMPOTENCY_RESPONSE_HEADERS_TOO_LARGE=响应头超过幂等重放上限。
COCO_IDEMPOTENCY_UNSAFE_RESPONSE_HEADER=响应包含无法安全缓存或重放的响应头。
COCO_IDEMPOTENCY_UNSUPPORTED_IO=当前 I/O 生命周期无法被幂等功能安全捕获。
COCO_IDEMPOTENCY_CAPACITY_EXCEEDED=幂等存储已达到容量上限。
COCO_IDEMPOTENCY_STORE_UNAVAILABLE=幂等存储不可用。
