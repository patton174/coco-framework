# coco-storage key and configuration
coco.storage.invalid-key=对象键不合法。
coco.storage.invalid-root=对象存储根目录不合法。
coco.storage.invalid-configuration=对象存储配置不合法。

# coco-storage object lifecycle
coco.storage.object-not-found=对象不存在。
coco.storage.object-already-exists=对象已存在，拒绝覆盖。

# coco-storage upload constraints
coco.storage.content-type-not-allowed=不允许的内容类型。
coco.storage.extension-not-allowed=不允许的对象扩展名。
coco.storage.content-length-mismatch=上传内容长度与声明长度不一致。
coco.storage.content-too-large=上传内容超过允许的最大长度。

# coco-storage backend failures
coco.storage.io-failure=对象存储访问失败。
coco.storage.corrupt-metadata=对象存储元数据无效。

# coco-storage content validation
coco.storage.signature-mismatch=上传内容的魔数与声明的扩展名不一致。
coco.storage.dangerous-content=上传内容命中危险文件签名。
coco.storage.scan-rejected=上传内容被文件扫描器拒绝。
