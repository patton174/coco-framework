name: Publish Agent Skills

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Run npm publish --dry-run only'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Serializes the whole workflow, so rapid dispatches queue instead of overlapping.
# This covers every step in the job, including install/test/audit/publish — a second
# dispatch waits rather than running tests concurrently. cancel-in-progress is false
# so an in-flight publish is never interrupted midway.
concurrency:
  group: npm-publish-agent-skills-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for trusted publishing: lets the job mint an OIDC token npm can verify.
      id-token: write
    steps:
      - name: Require the protected main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Publish must be dispatched from the protected main branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Trusted publishing needs Node >= 22.14.0; the package itself only requires >= 20.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Pinned so the release toolchain cannot drift between runs. Trusted
          # publishing requires Node >= 22.14.0.
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with Node 22.
      # Pinned rather than @latest so a release is reproducible.
      - name: Upgrade npm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          npm --version

      - name: Install dependencies
        working-directory: coco-support/coco-tools/coco-agent-skills
        shell: bash
        run: npm ci

      - name: Run tests
        working-directory: coco-support/coco-tools/coco-agent-skills
        shell: bash
        run: npm test

      - name: Rebuild and validate the published documentation index
        working-directory: coco-support/coco-tools/coco-agent-skills
        shell: bash
        run: |
          set -euo pipefail
          npm run build-index
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {loadIndex, EMBEDDING_DIMENSION, EMBEDDING_MODEL, LOCALES} from './src/search.mjs';
          const index = await loadIndex();
          const meta = JSON.parse(await readFile('data/doc-index.meta.json', 'utf8'));
          assert.equal(meta.placeholder, false, 'Cannot publish a placeholder index');
          assert.ok(index.length > 0, 'Cannot publish an empty index');
          assert.equal(meta.chunkCount, index.length);
          assert.equal(meta.totalChunksDiscovered, index.length);
          assert.equal(meta.dimension, EMBEDDING_DIMENSION);
          assert.equal(meta.model, EMBEDDING_MODEL);
          assert.equal(meta.frameworkDocsCommit, execFileSync('git', ['rev-parse', '--short', 'HEAD'], {encoding: 'utf8'}).trim());
          assert.equal(new Set(index.map(entry => entry.id)).size, index.length);
          for (const locale of LOCALES) {
            const entries = index.filter(entry => entry.locale === locale);
            assert.ok(entries.length > 0, `Missing locale: ${locale}`);
            assert.equal(meta.locales[locale].chunks, entries.length);
            assert.equal(meta.locales[locale].files, new Set(entries.map(entry => entry.docPath)).size);
          }
          for (const entry of index) {
            assert.equal(entry.embedding.length, EMBEDDING_DIMENSION);
            assert.ok(entry.embedding.every(Number.isFinite));
            assert.ok(entry.embedding.some(value => value !== 0));
          }
          console.log(`Validated ${index.length} vectors from ${meta.frameworkDocsCommit}`);
          JS

      # Blocks the release on any high or critical advisory. There is no `|| true`
      # anywhere in this step, so a non-zero npm audit exit fails the job under
      # `set -euo pipefail`. The full report is printed by the same command.
      - name: Audit dependencies
        working-directory: coco-support/coco-tools/coco-agent-skills
        shell: bash
        run: |
          set -euo pipefail
          npm audit --registry=https://registry.npmjs.org/ --audit-level=high

      # Fail early with a clear message instead of letting npm return an opaque 403.
      - name: Reject an already-published version
        if: ${{ !inputs.dryRun }}
        working-directory: coco-support/coco-tools/coco-agent-skills
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "local version: ${VERSION}"
          if npm view "@patton174/coco-agent-skills@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::Version ${VERSION} is already published; bump the version first."
            exit 1
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dryRun }}
        working-directory: coco-support/coco-tools/coco-agent-skills
        shell: bash
        run: npm publish --dry-run

      # provenance also comes from publishConfig; passed explicitly because npm has
      # not always applied it automatically under trusted publishing.
      - name: Publish
        if: ${{ !inputs.dryRun }}
        working-directory: coco-support/coco-tools/coco-agent-skills
        shell: bash
        run: npm publish --provenance
