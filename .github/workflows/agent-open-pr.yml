name: Open Agent Pull Request

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: Existing same-repository agent branch (prefix from COCO_AGENT_BRANCH_PREFIXES, default codex/)
        required: true
        type: string
      head_sha:
        description: Exact 40-character commit SHA for the head branch
        required: true
        type: string
      title:
        description: Pull request title
        required: true
        type: string

permissions:
  contents: read

env:
  # Agent pull requests target the integration branch. Dispatch itself remains
  # bound to main so the workflow definition always comes from protected code.
  TARGET_BASE: dev

concurrency:
  group: agent-open-pr-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  open:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: coco-agent
    timeout-minutes: 5
    steps:
      - name: Validate protected source and requested branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_TITLE: ${{ inputs.title }}
          AGENT_BRANCH_PREFIXES: ${{ vars.COCO_AGENT_BRANCH_PREFIXES }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo "::error::Agent pull requests can only be opened from protected main."
            exit 1
          fi

          repository_json="$(gh api "repos/${GITHUB_REPOSITORY}")"
          if [[ "$(jq -r '.id' <<< "${repository_json}")" != "${GITHUB_REPOSITORY_ID}" \
             || "$(jq -r '.default_branch' <<< "${repository_json}")" != 'main' ]]; then
            echo "::error::Repository identity or default branch is invalid."
            exit 1
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${GITHUB_SHA}" != "${main_sha}" ]]; then
            echo "::error::Workflow source is not the current protected main commit."
            exit 1
          fi

          # The prefix list is the same repository variable the Contributor gate
          # reads (contributor_gate.py). Unset or blank keeps the codex/ default.
          # A configured list is the complete set, and any malformed entry fails
          # the dispatch instead of being skipped. This job checks out nothing, so
          # the shape rule is restated here; test_agent_review.py compares it with
          # agent_review.parse_agent_branch_prefixes so the two cannot drift.
          agent_prefixes="${AGENT_BRANCH_PREFIXES:-}"
          if [[ -z "${agent_prefixes//[[:space:]]/}" ]]; then
            agent_prefixes='codex/'
          fi
          prefix_matched=false
          configured_prefix_count=0
          # The variable may span several lines. -d '' lets read run past newlines
          # (the default stops at the first one and would silently drop every
          # later prefix), and it returns non-zero at EOF, which set -e must not
          # treat as a failure. The trailing newline stays in the last entry and
          # is removed by the trim below, like the leading one in Python's strip().
          IFS=',' read -r -d '' -a prefix_entries <<< "${agent_prefixes}" || true
          for prefix_entry in "${prefix_entries[@]}"; do
            # Trim both ends only: whitespace inside an entry is malformed and must
            # be rejected, exactly as parse_agent_branch_prefixes rejects it.
            prefix="${prefix_entry#"${prefix_entry%%[![:space:]]*}"}"
            prefix="${prefix%"${prefix##*[![:space:]]}"}"
            if [[ -z "${prefix}" ]]; then
              continue
            fi
            if [[ ! "${prefix}" =~ ^[a-z][a-z0-9-]*/$ || "${prefix}" == 'dependabot/' ]]; then
              echo "::error::COCO_AGENT_BRANCH_PREFIXES contains an invalid agent branch prefix."
              exit 1
            fi
            configured_prefix_count=$((configured_prefix_count + 1))
            if [[ "${HEAD_BRANCH}" == "${prefix}"* && "${#HEAD_BRANCH}" -gt "${#prefix}" ]]; then
              prefix_matched=true
            fi
          done
          if (( configured_prefix_count == 0 )); then
            echo "::error::COCO_AGENT_BRANCH_PREFIXES must name at least one prefix."
            exit 1
          fi
          if [[ "${prefix_matched}" != 'true' \
             || ! "${HEAD_BRANCH}" =~ ^[a-z][a-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._/-]*$ \
             || "${HEAD_BRANCH}" == */ \
             || "${HEAD_BRANCH}" == *..* \
             || "${HEAD_BRANCH}" == *//* \
             || "${HEAD_BRANCH}" == *'@{'* \
             || "${HEAD_BRANCH}" == *.lock ]]; then
            echo "::error::Head branch is not a valid agent contribution branch."
            exit 1
          fi
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ \
             || -z "${PR_TITLE//[[:space:]]/}" ]]; then
            echo "::error::Head SHA or pull request title is invalid."
            exit 1
          fi

          # shellcheck disable=SC2016
          encoded_branch="$(jq -rn --arg value "${HEAD_BRANCH}" '$value | @uri')"
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" \
            --jq '.commit.sha')"
          if [[ "${branch_sha}" != "${HEAD_SHA}" ]]; then
            echo "::error::Head branch no longer points to the requested SHA."
            exit 1
          fi
          # Dispatch stays bound to main (the trust boundary verified above), but
          # contributor pull requests target the integration branch, so the head
          # must be current with dev rather than with main.
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BASE}" \
            --jq '.object.sha')"
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target base branch '${TARGET_BASE}' has no valid head."
            exit 1
          fi
          compare_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${HEAD_SHA}")"
          ahead_by="$(jq -r '.ahead_by' <<< "${compare_json}")"
          behind_by="$(jq -r '.behind_by' <<< "${compare_json}")"
          if [[ ! "${ahead_by}" =~ ^[0-9]+$ || ! "${behind_by}" =~ ^[0-9]+$ \
             || "${ahead_by}" -le 0 || "${behind_by}" -ne 0 ]]; then
            echo "::error::Head must contain current ${TARGET_BASE} and add at least one commit."
            exit 1
          fi

      - name: Create Coco Agent installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COCO_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.COCO_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Verify App identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_APP_SLUG: ${{ vars.COCO_AGENT_APP_SLUG }}
          EXPECTED_APP_LOGIN: ${{ vars.COCO_AGENT_APP_LOGIN }}
          EXPECTED_APP_BOT_ID: ${{ vars.COCO_AGENT_APP_BOT_ID }}
        run: |
          set -euo pipefail
          for variable in ACTUAL_APP_SLUG EXPECTED_APP_SLUG EXPECTED_APP_LOGIN EXPECTED_APP_BOT_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::${variable} must be configured."
              exit 1
            fi
          done
          if [[ "${ACTUAL_APP_SLUG}" != "${EXPECTED_APP_SLUG}" \
             || "${EXPECTED_APP_LOGIN}" != "${EXPECTED_APP_SLUG}[bot]" \
             || ! "${EXPECTED_APP_BOT_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub App identity variables do not match repository policy."
            exit 1
          fi
          user_json="$(gh api "users/${EXPECTED_APP_LOGIN}")"
          if [[ "$(jq -r '.login' <<< "${user_json}")" != "${EXPECTED_APP_LOGIN}" \
             || "$(jq -r '.type' <<< "${user_json}")" != 'Bot' \
             || "$(jq -r '.id' <<< "${user_json}")" != "${EXPECTED_APP_BOT_ID}" ]]; then
            echo "::error::GitHub App bot identity does not match repository policy."
            exit 1
          fi

      - name: Open or reuse the bound pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_TITLE: ${{ inputs.title }}
          EXPECTED_APP_LOGIN: ${{ vars.COCO_AGENT_APP_LOGIN }}
          EXPECTED_APP_BOT_ID: ${{ vars.COCO_AGENT_APP_BOT_ID }}
        run: |
          set -euo pipefail
          repository_json="$(GH_TOKEN="${READ_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}")"
          repository_id="$(jq -r '.id' <<< "${repository_json}")"
          default_branch="$(jq -r '.default_branch' <<< "${repository_json}")"
          base_sha="$(GH_TOKEN="${READ_TOKEN}" gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BASE}" --jq '.object.sha')"
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target base branch '${TARGET_BASE}' has no valid head."
            exit 1
          fi
          # shellcheck disable=SC2016
          encoded_branch="$(jq -rn --arg value "${HEAD_BRANCH}" '$value | @uri')"
          branch_sha="$(GH_TOKEN="${READ_TOKEN}" gh api \
            "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.commit.sha')"
          compare_json="$(GH_TOKEN="${READ_TOKEN}" gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${HEAD_SHA}")"
          ahead_by="$(jq -r '.ahead_by' <<< "${compare_json}")"
          behind_by="$(jq -r '.behind_by' <<< "${compare_json}")"
          if [[ "${repository_id}" != "${GITHUB_REPOSITORY_ID}" \
             || "${default_branch}" != 'main' \
             || "${branch_sha}" != "${HEAD_SHA}" \
             || ! "${ahead_by}" =~ ^[0-9]+$ \
             || ! "${behind_by}" =~ ^[0-9]+$ \
             || "${ahead_by}" -le 0 \
             || "${behind_by}" -ne 0 ]]; then
            echo "::error::Repository or branch binding changed before PR creation."
            exit 1
          fi

          validate_pr() {
            local pr_json="$1"
            if [[ "$(jq -r '.state // empty' <<< "${pr_json}")" != 'open' \
               || "$(jq -r '.user.login // empty' <<< "${pr_json}")" != "${EXPECTED_APP_LOGIN}" \
               || "$(jq -r '.user.type // empty' <<< "${pr_json}")" != 'Bot' \
               || "$(jq -r '.user.id // empty' <<< "${pr_json}")" != "${EXPECTED_APP_BOT_ID}" \
               || "$(jq -r '.head.repo.id // empty' <<< "${pr_json}")" != "${repository_id}" \
               || "$(jq -r '.head.repo.full_name // empty' <<< "${pr_json}")" != "${GITHUB_REPOSITORY}" \
               || "$(jq -r '.head.ref // empty' <<< "${pr_json}")" != "${HEAD_BRANCH}" \
               || "$(jq -r '.head.sha // empty' <<< "${pr_json}")" != "${HEAD_SHA}" \
               || "$(jq -r '.base.repo.id // empty' <<< "${pr_json}")" != "${repository_id}" \
               || "$(jq -r '.base.repo.full_name // empty' <<< "${pr_json}")" != "${GITHUB_REPOSITORY}" \
               || "$(jq -r '.base.ref // empty' <<< "${pr_json}")" != "${TARGET_BASE}" ]]; then
              echo "::error::Pull request identity or branch binding is invalid." >&2
              return 1
            fi
          }

          owner="${GITHUB_REPOSITORY_OWNER}"
          prs_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f "head=${owner}:${HEAD_BRANCH}" \
            -f per_page=100)"
          pr_count="$(jq 'length' <<< "${prs_json}")"
          if (( pr_count > 1 )); then
            echo "::error::Multiple pull requests match the requested branch."
            exit 1
          fi
          if (( pr_count == 1 )); then
            pr_json="$(jq -c '.[0]' <<< "${prs_json}")"
            validate_pr "${pr_json}"
            echo "Reusing $(jq -r '.html_url' <<< "${pr_json}")."
            exit 0
          fi

          # shellcheck disable=SC2016
          printf -v pr_body \
            'Opened by the protected Coco Agent contribution workflow. Branch: `%s`. Head: `%s`. Requested by: `%s`. Run: %s' \
            "${HEAD_BRANCH}" "${HEAD_SHA}" "${GITHUB_ACTOR}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          created_json="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f "title=${PR_TITLE}" \
            -f "head=${owner}:${HEAD_BRANCH}" \
            -f "base=${TARGET_BASE}" \
            -f "body=${pr_body}" \
            -F maintainer_can_modify=true)"
          pr_number="$(jq -r '.number // empty' <<< "${created_json}")"
          if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub did not return a pull request number."
            exit 1
          fi
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          validate_pr "${pr_json}"
          echo "Created $(jq -r '.html_url' <<< "${pr_json}")."
