name: Reusable / API Compatibility Candidate

# Candidate code runs here. This job has no credentials beyond a read-only
# contents token and produces only non-authoritative JAR evidence.

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact pull request or merge-group candidate SHA
        required: true
        type: string
      candidate_repository:
        description: Repository that owns the exact candidate SHA
        required: true
        type: string
      source_event:
        description: Exact source event that selected the candidate SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  produce:
    name: Produce exact candidate JARs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.candidate_sha }}
          path: .api-candidate
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate checkout is exact and clean before build
        working-directory: .api-candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build exact candidate JARs
        working-directory: .api-candidate
        run: mvn -B -ntp -DskipTests clean package

      - name: Verify candidate checkout is exact and clean after build
        working-directory: .api-candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Stage exactly 32 non-authoritative candidate JARs
        working-directory: .api-candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_EVENT: ${{ inputs.source_event }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGE_ROOT: ${{ runner.temp }}/api-compatibility-candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python .github/scripts/api_compatibility_gate_protocol.py stage-candidate \
            --candidate-root . \
            --output-root "${STAGE_ROOT}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --source-event "${SOURCE_EVENT}" \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-run-attempt "${SOURCE_RUN_ATTEMPT}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload exactly 32 candidate JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-compatibility-candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-compatibility-candidate
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

      - name: Verify candidate checkout is exact and clean after upload
        working-directory: .api-candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
