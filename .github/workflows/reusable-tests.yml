name: Reusable / Tests

# Reusable test pipeline: cross-platform framework build, sample verification,
# focused release-artifact verification, and isolated Maven compatibility
# consumers. Called by ci.yml (push/PR) and release.yml (before publishing) so
# the exact same verification runs in CI and at release time. Not triggered
# directly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      JAVA_TOOLCHAIN_VERSION: '21'
      MAVEN_COMPILE_RELEASE: '17'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 21 toolchain
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}
          cache: maven

      - name: Show Java toolchain and target bytecode
        shell: bash
        run: |
          java -version
          echo "Maven compiler release target: ${MAVEN_COMPILE_RELEASE}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt

      - name: Install sample verification dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements/ci.txt

      - name: Verify framework and install artifacts
        run: mvn -B -ntp install

      - name: Verify canonical artifact ownership
        run: >-
          python coco-support/coco-tools/artifact-ownership/check_artifact_ownership.py
          --version 1.0.0-SNAPSHOT

      - name: Verify sample parent version alignment
        run: python coco-samples/coco-sample-basic/scripts/verify_parent_version.py

      - name: Verify sample business application
        run: mvn -B -ntp -f coco-samples/coco-sample-basic/pom.xml verify

      - name: Verify sample feature pruning
        shell: bash
        run: |
          set -euo pipefail
          assert_no_match() {
            local pattern="$1"
            local grep_status
            shift
            set +e
            grep -E "${pattern}" "$@"
            grep_status=$?
            set -e
            case "${grep_status}" in
              0)
                echo "::error::Forbidden dependency pattern matched: ${pattern}"
                return 1
                ;;
              1) return 0 ;;
              *)
                echo "::error::grep failed with status ${grep_status}."
                return "${grep_status}"
                ;;
            esac
          }

          sample_jar='coco-samples/coco-sample-basic/target/coco-sample-basic-0.0.1-SNAPSHOT.jar'
          original_jar='coco-samples/coco-sample-basic/target/coco-prune.original.jar'
          jar_entries="${RUNNER_TEMP}/coco-sample-basic-jar-entries.txt"
          jar tf "${sample_jar}" > "${jar_entries}"
          test -f "${original_jar}"
          python - "${sample_jar}" "${original_jar}" <<'PY'
          import json
          import sys
          import zipfile

          def libraries(archive):
              names = [
                  name for name in archive.namelist()
                  if name.startswith("BOOT-INF/lib/") and name.endswith(".jar")
              ]
              assert len(names) == len(set(names)), "duplicate BOOT-INF/lib entry"
              return set(names)

          def index_references(archive, name):
              content = archive.read(name).decode("utf-8")
              references = []
              for line in content.splitlines():
                  stripped = line.strip()
                  if "BOOT-INF/lib/" not in stripped:
                      continue
                  assert stripped.startswith('- "') and stripped.endswith('"'), (
                      f"malformed {name} library line: {line!r}"
                  )
                  reference = stripped[3:-1]
                  assert reference.startswith("BOOT-INF/lib/") and reference.endswith(".jar")
                  references.append(reference)
              assert len(references) == len(set(references)), f"duplicate {name} reference"
              return set(references)

          expected_removed_libraries = (
              "BOOT-INF/lib/HikariCP-7.0.2.jar",
              "BOOT-INF/lib/coco-data-permission-1.0.0-SNAPSHOT.jar",
              "BOOT-INF/lib/coco-feature-codegen-1.0.0-SNAPSHOT.jar",
              "BOOT-INF/lib/coco-mybatis-plus-1.0.0-SNAPSHOT.jar",
              "BOOT-INF/lib/coco-tenant-1.0.0-SNAPSHOT.jar",
              "BOOT-INF/lib/freemarker-2.3.34.jar",
              "BOOT-INF/lib/jsqlparser-4.9.jar",
              "BOOT-INF/lib/mybatis-3.5.19.jar",
              "BOOT-INF/lib/mybatis-plus-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-annotation-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-core-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-extension-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-jsqlparser-4.9-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-jsqlparser-common-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-spring-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-spring-boot-autoconfigure-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-spring-boot-native-image-3.5.17.jar",
              "BOOT-INF/lib/mybatis-plus-spring-boot4-starter-3.5.17.jar",
              "BOOT-INF/lib/mybatis-spring-4.0.0.jar",
              "BOOT-INF/lib/spring-boot-jdbc-4.1.0.jar",
              "BOOT-INF/lib/spring-boot-persistence-4.1.0.jar",
              "BOOT-INF/lib/spring-boot-sql-4.1.0.jar",
              "BOOT-INF/lib/spring-boot-transaction-4.1.0.jar",
              "BOOT-INF/lib/spring-jdbc-7.0.8.jar",
              "BOOT-INF/lib/spring-tx-7.0.8.jar",
          )

          with zipfile.ZipFile(sys.argv[1]) as current, zipfile.ZipFile(sys.argv[2]) as original:
              current_libraries = libraries(current)
              original_libraries = libraries(original)
              current_classpath = index_references(current, "BOOT-INF/classpath.idx")
              current_layers = index_references(current, "BOOT-INF/layers.idx")
              original_classpath = index_references(original, "BOOT-INF/classpath.idx")
              original_layers = index_references(original, "BOOT-INF/layers.idx")

              assert current_classpath == current_libraries
              assert current_layers == current_libraries
              assert original_classpath == original_libraries
              assert original_layers == original_libraries
              assert current_classpath == current_layers
              assert original_classpath == original_layers

              removed_libraries = original_libraries - current_libraries
              removed_classpath = original_classpath - current_classpath
              removed_layers = original_layers - current_layers
              added_libraries = current_libraries - original_libraries
              assert added_libraries == set()
              assert tuple(sorted(removed_libraries)) == expected_removed_libraries
              assert tuple(sorted(removed_classpath)) == expected_removed_libraries
              assert tuple(sorted(removed_layers)) == expected_removed_libraries

              manifest = json.loads(current.read("META-INF/coco/features.json"))
          states = {entry["id"]: entry["enabled"] for entry in manifest["features"]}
          assert {feature for feature, enabled in states.items() if enabled} == {
              "audit", "openapi", "security", "web"
          }
          assert states["codegen"] is False
          assert states["mybatis-plus"] is False
          PY
          for feature in web audit security openapi; do
            canonical_count="$(grep -c "BOOT-INF/lib/coco-${feature}-" "${jar_entries}" || true)"
            if (( canonical_count != 1 )); then
              echo "::error::Expected exactly one canonical ${feature} artifact; found ${canonical_count}."
              exit 1
            fi
          done
          assert_no_match \
            'BOOT-INF/lib/coco-feature-(web|mybatis-plus|audit|security|tenant|data-permission|openapi)-' \
            "${jar_entries}"
          disabled_closure_pattern='BOOT-INF/lib/(coco-feature-codegen-|coco-(mybatis-plus|tenant|data-permission)-|freemarker-|HikariCP-|jsqlparser-|mybatis[^/]*-|spring-boot-(jdbc|persistence|sql|transaction)-|spring-(jdbc|tx)-)'
          assert_no_match "${disabled_closure_pattern}" "${jar_entries}"

      - name: Verify sample feature coordinates
        run: >-
          python .github/scripts/verify_sample_feature_coordinates.py
          --archive coco-samples/coco-sample-basic/target/coco-sample-basic-0.0.1-SNAPSHOT.jar
          --required-features web audit security openapi
          --forbidden-features mybatis-plus tenant data-permission codegen
          --forbidden-library-prefixes mybatis-

      - name: Verify sample business flow with Python
        run: python coco-samples/coco-sample-basic/scripts/verify_business_flow.py

      - name: Verify full sample business application
        run: mvn -B -ntp -f coco-samples/coco-sample-full/pom.xml verify

      - name: Verify full sample feature composition
        shell: bash
        run: |
          set -euo pipefail
          jar_entries="${RUNNER_TEMP}/coco-sample-full-jar-entries.txt"
          jar tf coco-samples/coco-sample-full/target/coco-sample-full-0.0.1-SNAPSHOT.jar \
            > "${jar_entries}"
          for feature in web mybatis-plus audit security tenant data-permission openapi; do
            canonical_count="$(grep -c "BOOT-INF/lib/coco-${feature}-" "${jar_entries}" || true)"
            if (( canonical_count != 1 )); then
              echo "::error::Expected exactly one canonical ${feature} artifact; found ${canonical_count}."
              exit 1
            fi
          done
          if grep -E \
            'BOOT-INF/lib/coco-feature-(web|mybatis-plus|audit|security|tenant|data-permission|openapi)-' \
            "${jar_entries}"; then
            echo "::error::Legacy 2.x compatibility artifacts must not be packaged in the full sample."
            exit 1
          fi
          grep 'BOOT-INF/lib/coco-feature-codegen-' "${jar_entries}"
          grep 'BOOT-INF/lib/h2-' "${jar_entries}"
          python - coco-samples/coco-sample-full/target/coco-sample-full-0.0.1-SNAPSHOT.jar <<'PY'
          import sys
          import zipfile

          def index_references(archive, name):
              references = []
              for line in archive.read(name).decode("utf-8").splitlines():
                  stripped = line.strip()
                  if "BOOT-INF/lib/" not in stripped:
                      continue
                  assert stripped.startswith('- "') and stripped.endswith('"')
                  references.append(stripped[3:-1])
              assert len(references) == len(set(references)), f"duplicate {name} reference"
              return set(references)

          with zipfile.ZipFile(sys.argv[1]) as full:
              codegen_libraries = {
                  name for name in full.namelist()
                  if name.startswith("BOOT-INF/lib/coco-feature-codegen-") and name.endswith(".jar")
              }
              assert len(codegen_libraries) == 1
              codegen_library = next(iter(codegen_libraries))
              assert codegen_library in index_references(full, "BOOT-INF/classpath.idx")
              assert codegen_library in index_references(full, "BOOT-INF/layers.idx")
          PY

      - name: Verify full sample feature coordinates
        run: >-
          python .github/scripts/verify_sample_feature_coordinates.py
          --archive coco-samples/coco-sample-full/target/coco-sample-full-0.0.1-SNAPSHOT.jar
          --required-features web mybatis-plus audit security tenant data-permission openapi
          --required-library-prefixes h2-
          --require-codegen

      - name: Verify full sample business flow with Python
        run: python coco-samples/coco-sample-full/scripts/verify_business_flow.py

  starter-release-artifacts:
    name: starter release artifacts (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_TOOLCHAIN_VERSION: '21'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 21 toolchain
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}
          cache: maven

      - name: Verify source-free starter release artifacts from clean state
        run: >-
          mvn -B -ntp -Prelease
          -pl :coco-spring-boot-starter -am
          '-Drevision=1.0.0-ci'
          '-Dgpg.skip=true'
          clean verify

  compatibility-consumers:
    name: compatibility consumers (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_TOOLCHAIN_VERSION: '21'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 21 toolchain
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Verify external compatibility consumers
        run: >-
          python coco-support/coco-tools/compatibility-consumers/run_compatibility_consumers.py
          --candidate-version 2.0.2-SNAPSHOT
          --install-candidate
          --jdk-home "$JAVA_HOME"

      - name: Verify candidate artifact ownership
        run: >-
          python coco-support/coco-tools/artifact-ownership/check_artifact_ownership.py
          --version 2.0.2-SNAPSHOT
