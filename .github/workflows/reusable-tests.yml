name: Reusable / Tests

# Reusable test pipeline: cross-platform framework reactor verification.
# Called by ci.yml (push/PR) and release.yml (before publishing) so the exact
# same verification runs in CI and at release time. Not triggered directly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      JAVA_TOOLCHAIN_VERSION: '21'
      MAVEN_COMPILE_RELEASE: '17'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 toolchain
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}
          cache: maven

      - name: Show Java toolchain and target bytecode
        shell: bash
        run: |
          java -version
          echo "Maven compiler release target: ${MAVEN_COMPILE_RELEASE}"

      - name: Verify framework reactor, feature assembly, and package pruning
        run: mvn -B -ntp install
