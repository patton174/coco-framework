name: Reusable / CodeQL

# Reusable Java security analysis. CI calls it for pushes, PRs, and manual
# verification; the schedule keeps the default branch scanned independently.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'  # weekly, Monday 05:37 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # CodeQL autobuild uses the working tree, but incremental analysis
        # benefits from full git history. fetch-depth: 0 also enables the
        # GitHub UI's blame/annotation features for findings.
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-java must precede CodeQL init so autobuild uses the right JDK.
      - name: Set up JDK 21 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: java-kotlin

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:java-kotlin"
